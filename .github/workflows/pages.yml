name: Update and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 07:00 Asia/Shanghai. GitHub cron is UTC, and China does not observe daylight saving.
    - cron: '0 23 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import shows and spoken marketing cases
        run: python scripts/update.py
      - uses: actions/cache@v4
        with:
          path: site/audio
          key: originals-audio-v1-${{ hashFiles('originals/*.json', 'scripts/originals.py') }}
          restore-keys: originals-audio-v1-
      - uses: actions/cache/restore@v4
        with:
          path: .tts-state
          key: tts-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tts-ledger-
      - name: Build original episodes
        env:
          AZURE_F0_CONFIRMED: ${{ vars.AZURE_F0_CONFIRMED }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
        run: |
          python scripts/originals.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .tts-state
          key: tts-ledger-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
