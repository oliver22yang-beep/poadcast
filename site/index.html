<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4c1d95">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>声间</title>
<body data-player="idle">
<header class="top">
  <div><p class="brand">SHENGJIAN · PODCASTS</p><h1>声间</h1></div><span class="header-label">随时收听</span>
</header>
<nav class="primary-nav" aria-label="主导航"><button data-page="discover" type="button"><span aria-hidden="true">⌕</span>发现</button><button data-page="listen" type="button"><span aria-hidden="true">♫</span>收听</button><button data-page="library" type="button"><span aria-hidden="true">▤</span>沉淀</button></nav>
<section id="discover-page" hidden><h2>今天想学习什么？</h2><form id="discover-form"><input id="discover-query" placeholder="例如：品牌转型" required maxlength="200"><button>搜索</button></form><p class="note">当前搜索已收录节目；尚未连接外部研究 Agent。</p><div id="discover-results" class="list"></div></section>
<section id="library-page" hidden><h2>我的收藏</h2><p class="note">收藏仅保存在当前设备。选择多篇资料后可导出整合请求。</p><button id="export-synthesis" class="utility">导出知识整合请求</button><div id="library-list" class="list"></div></section>
<main id="listen-page"><div id="resume-box" hidden><button id="resume-episode" class="utility">继续收听</button></div><div class="picker" role="tablist" aria-label="分类">
  <button id="tab-followed" type="button" role="tab" aria-selected="true" aria-controls="panel-followed">
    <span class="cat-kicker">订阅节目</span>
    <span class="cat-title">外部订阅</span>
    <span class="cat-sub">半拿铁</span>
    <span class="cat-badge">已选</span>
  </button>
  <button id="tab-marketing" type="button" role="tab" aria-selected="false" aria-controls="panel-marketing">
    <span class="cat-kicker">每天更新</span>
    <span class="cat-title">自主内容</span>
    <span class="cat-sub">音频 · 朗读</span>
    <span class="cat-badge">已选</span>
  </button>
</div>
<p id="status" role="status">正在读取节目…</p>
<section id="panel-followed" role="tabpanel" aria-labelledby="tab-followed">
  <p class="note" id="followed-note"></p>
  <details class="subscription"><summary>管理 RSS 订阅</summary><form id="subscribe">
    <input id="rss" type="url" required placeholder="添加公开 RSS" aria-label="RSS 地址" inputmode="url">
    <button type="submit">订阅</button>
  </form></details>
  <div id="followed-chips" class="chips" role="toolbar" aria-label="在听的节目"></div>
  <div id="followed-list" class="list"></div>
</section>
<section id="panel-marketing" role="tabpanel" aria-labelledby="tab-marketing" hidden>
  <p class="note">原创节目支持完整文稿朗读；外部文章保留短导语及原文链接。</p>
  <div id="marketing-chips" class="chips" role="toolbar" aria-label="营销案例来源"></div>
  <div id="marketing-list" class="list"></div>
</section>
</main><footer class="mini"><div class="mini-controls"><button id="mini-toggle" type="button" aria-label="播放或暂停">▶</button><button id="mini-expand" type="button" aria-expanded="false">展开播放器</button></div>
  <p id="now">选择一期，开始收听</p>
  <p id="mode" class="mode"></p>
  <audio id="audio" controls playsinline preload="metadata"></audio>
  <div class="transport">
    <button id="back" type="button">−15秒</button>
    <select id="speed" aria-label="速度">
      <option>1</option>
      <option>1.25</option>
      <option>1.5</option>
      <option>2</option>
    </select>
    <button id="forward" type="button">+30秒</button>
    <button id="stop-speech" type="button">停止朗读</button>
  </div>
</footer>
<script src="app.js"></script>
</body>
</html>
